name: build-and-publish

# every push to master: run tests, then build the arm64 image and push it to GHCR. pushing the tag is the whole
# deployment trigger — flux image automation bumps the overlay from the registry — so the workflow itself touches
# nothing outside the runner
on:
  push:
    branches: [master]

concurrency:
  # serialise builds: the ImagePolicy picks the newest image by sorting tags alphabetically, so two builds in flight
  # at once could stamp the older commit with the later timestamp and leave it selected
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      # the registry credential is this run's own GITHUB_TOKEN, not a stored PAT
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nyorf/hello-dexter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute image tag
        # master-<UTC timestamp>-<short sha>, timestamp in zero-padded basic format so an alphabetical sort is a
        # chronological one. the ImagePolicy filters on exactly this pattern and ignores, silently, any tag that
        # misses it — hence the assertion rather than a bare assignment
        run: |
          TAG="master-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:7}"
          printf '%s' "$TAG" | grep -qE '^master-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7,40}$' || {
            echo "::error::computed tag '$TAG' does not match the tag pattern the ImagePolicy selects on"
            exit 1
          }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build --no-cache \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$TAG" \
            -f Containerfile \
            -t "$IMAGE:$TAG" .
          # a mislabelled runner or an edit to runs-on would publish amd64, and the tag and digest would look right
          # while every pod crashed with exec format error
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE:$TAG")" = arm64

      - name: Smoke-test image
        # the image serves two files; the sizes come from the checkout, so the check cannot drift from the data. the
        # json wallpaper is the route that runs opencv, so it has to come back as a whole jpeg
        run: |
          docker run --rm --entrypoint python "$IMAGE:$TAG" -c "import main"
          cid=$(docker run -d -p 8000:8000 "$IMAGE:$TAG")
          trap 'docker logs "$cid"; docker rm -f "$cid" >/dev/null' EXIT
          for _ in $(seq 30); do
            curl -fs -o /dev/null localhost:8000/robots.txt && break
            sleep 1
          done
          test "$(curl -fsS -o /dev/null -w '%{size_download}' localhost:8000/robots.txt)" = "$(stat -c %s data/robots.txt)"
          test "$(curl -fsS -o /dev/null -w '%{size_download}' 'localhost:8000/wallpaper?img=true')" = "$(stat -c %s data/wallpaper.jpg)"
          curl -fsS localhost:8000/wallpaper | python3 -c '
          import base64, json, sys
          jpg = base64.b64decode(json.load(sys.stdin)["image"], validate=True)
          sys.exit(0 if jpg[:3] == b"\xff\xd8\xff" and jpg[-2:] == b"\xff\xd9" else "/wallpaper did not return a whole jpeg")
          '

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push image
        # no floating tag: the deployment pins tag and digest together, so a :latest here would be a second name
        # nothing ever resolves by
        run: |
          docker push "$IMAGE:$TAG"
          printf 'pushed %s\n' "$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")" \
            >> "$GITHUB_STEP_SUMMARY"
